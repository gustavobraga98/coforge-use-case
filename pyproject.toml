[project]
name = "atlas-travel-assistant"
version = "0.1.0"
description = "Local assistant API for the fictional Atlas Travel demonstration"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-ai-slim[ag-ui,openai]>=1.0,<2",
  "python-dotenv>=1.0,<2",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
